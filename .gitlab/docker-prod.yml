# =========================================================
# 🚀 Production Docker Image
# =========================================================
#
# GitHub Equivalent
# -----------------
# .github/workflows/docker-prod.yml
#
# Purpose
# -------
# Build production images after the package gate validates a reviewed,
# protected, annotated release tag.
#
# Registry
# --------
# GitLab Container Registry:
#
#   registry.gitlab.com/<group>/<project>
#
# Production Tags
# ---------------
# latest
# v1.0.0
# v1.1.0-rc.1
# v1.1.0
# v2.0.0
#
# Trigger
# -------
#
#   git tag -a v1.0.0 -F .config/custy/templates/tag-message.txt
#   git push origin v1.0.0
#
# Notes
# -----
# Versioned production images are immutable release artifacts. The `latest`
# alias is updated only by stable releases.
#
# =========================================================

docker:prod:
  stage: docker

  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  needs:
    - job: package:build
      artifacts: true

  before_script:
    - docker version

  script:
    - |
      STABLE_TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+$'
      TAG="$CI_COMMIT_TAG"

      if [ -z "$PACKAGE_VERSION" ]; then
        echo "The package gate did not provide a canonical PEP 440 version." >&2
        exit 1
      fi

      IMAGE_TAG="$(printf '%s' "$TAG" | tr '+' '-')"

      echo "$CI_REGISTRY_PASSWORD" |
        docker login "$CI_REGISTRY" \
          -u "$CI_REGISTRY_USER" \
          --password-stdin

      docker build \
        --build-arg CUSTY_BUILD_VERSION="$PACKAGE_VERSION" \
        -f Dockerfile \
        --target production \
        --label org.opencontainers.image.title="$CI_PROJECT_NAME" \
        --label org.opencontainers.image.description="Custy project and Git release workflow automation" \
        --label org.opencontainers.image.url="$CI_PROJECT_URL" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        --label org.opencontainers.image.version="$TAG" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        .

      docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

      if printf '%s' "$TAG" | grep -Eq "$STABLE_TAG_REGEX"; then
        docker tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      else
        echo "Prerelease tag detected; latest will not be updated."
      fi

  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
