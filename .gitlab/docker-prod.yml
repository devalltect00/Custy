# =========================================================
# 🚀 Production Docker Image
# =========================================================
#
# GitHub Equivalent
# -----------------
# .github/workflows/docker-prod.yml
#
# Purpose
# -------
# Build immutable production Docker images from version tags.
#
# Registry
# --------
# GitLab Container Registry:
#
#   registry.gitlab.com/<group>/<project>
#
# Production Tags
# ---------------
# latest
# v1.0.0
# v1.1.0
# v2.0.0
#
# Trigger
# -------
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Notes
# -----
# Production images should never be overwritten.
#
# =========================================================

docker:prod:
  stage: docker

  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - docker version

    - echo "$CI_REGISTRY_PASSWORD" |
      docker login "$CI_REGISTRY"
      -u "$CI_REGISTRY_USER"
      --password-stdin

  script:
    - |
      docker build \
        -f docker/prod/Dockerfile \
        --label org.opencontainers.image.title="$CI_PROJECT_NAME" \
        --label org.opencontainers.image.description="Path Header Scanner" \
        --label org.opencontainers.image.url="$CI_PROJECT_URL" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        --label org.opencontainers.image.version="$CI_COMMIT_TAG" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG}" \
        -t "$CI_REGISTRY_IMAGE:latest" \
        .

    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG}"

    - docker push "$CI_REGISTRY_IMAGE:latest"

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
