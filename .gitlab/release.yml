# =========================================================
# 📦 Release Management
# =========================================================
#
# GitHub Equivalent
# -----------------
# .github/workflows/release.yml
#
# Purpose
# -------
# Create GitLab Releases after private package and production image publication.
#
# Artifacts
# ---------
# - Python Wheel (*.whl)
# - Source Distribution (*.tar.gz)
#
# Trigger
# -------
#
#   git tag -a v1.0.0 -F .config/custy/templates/tag-message.txt
#   git push origin v1.0.0
#
# Output
# ------
# - GitLab Release
# - Downloadable Build Artifacts
#
# Notes
# -----
# Releases are generated only from reviewed annotated version tags. The full
# tag message becomes the public release description.
#
# =========================================================

release:create:
  stage: release

  image: registry.gitlab.com/gitlab-org/cli:latest

  variables:
    GIT_DEPTH: "0"

  needs:
    - job: package:build
      artifacts: true
    - job: package:publish
      artifacts: false
    - job: docker:prod
      artifacts: false

  script:
    - |
      TAG="$CI_COMMIT_TAG"

      if ! git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"; then
        echo "Unable to fetch release tag metadata: $TAG" >&2
        exit 1
      fi

      if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
        echo "Release tag does not exist in the repository: $TAG" >&2
        exit 1
      fi

      TAG_TYPE="$(git cat-file -t "refs/tags/$TAG")"
      if [ "$TAG_TYPE" != "tag" ]; then
        echo "GitLab Releases require an annotated Git tag: $TAG" >&2
        exit 1
      fi

      TAG_MESSAGE="$(git tag -l --format='%(contents)' "$TAG")"
      if ! printf '%s' "$TAG_MESSAGE" | grep -q '[^[:space:]]'; then
        echo "Annotated release tag has an empty message: $TAG" >&2
        exit 1
      fi

      VERSION="${TAG#v}"
      RELEASE_TYPE="stable"

      case "$PACKAGE_VERSION" in
        *a[0-9]*) RELEASE_TYPE="alpha" ;;
        *b[0-9]*) RELEASE_TYPE="beta" ;;
        *rc[0-9]*) RELEASE_TYPE="rc" ;;
        *.dev[0-9]*) RELEASE_TYPE="dev" ;;
        *.post[0-9]*) RELEASE_TYPE="post" ;;
      esac

      IMAGE_TAG="$(printf '%s' "$TAG" | tr '+' '-')"

      printf '%s\n' "$TAG_MESSAGE" > RELEASE_NOTES.md

      cat <<EOF >> RELEASE_NOTES.md

      ---

      ## 📅 Release Information

      - Version: \`$VERSION\`
      - Python Package Version: \`$PACKAGE_VERSION\`
      - Release Type: \`$RELEASE_TYPE\`
      - Project: \`$CI_PROJECT_PATH\`
      - Commit: [$CI_COMMIT_SHORT_SHA]($CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA)
      - Pipeline: [$CI_PIPELINE_ID]($CI_PIPELINE_URL)

      ## 🐋 Docker Image

      \`\`\`bash
      docker pull $CI_REGISTRY_IMAGE:$IMAGE_TAG
      \`\`\`

      ## 📥 Python Package

      Install this private package with a deploy token that has
      \`read_package_registry\` permission:

      \`\`\`bash
      python -m pip install --index-url "https://<deploy-token-user>:<deploy-token>@${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/pypi/simple" "custy==$PACKAGE_VERSION"
      \`\`\`

      [View packages]($CI_PROJECT_URL/-/packages) or [download the release build artifacts]($CI_PROJECT_URL/-/jobs/artifacts/$TAG/download?job=package%3Abuild).
      Pipeline artifacts are retained for 90 days.
      EOF

      echo "Prepared release notes from annotated tag $TAG"

  release:
    tag_name: "$CI_COMMIT_TAG"

    name: "Release $CI_COMMIT_TAG"

    description: "./RELEASE_NOTES.md"

  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
