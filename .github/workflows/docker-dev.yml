# .github/workflows/docker-dev.yml

name: 🐋 Docker Development Image

run-name: 🐋 Dev Docker Build • ${{ github.ref_name }}

# =========================================================
# 🐋 Development Docker Image
# ---------------------------------------------------------
# Trigger:
# - Runs on push to `develop`
# - Can also be triggered manually
#
# Purpose:
# - Build and publish a development Docker image
#
# Published Tags:
# - `:dev`
#     Latest development image
#
# - `:sha-<commit>`
#     Immutable image for debugging and rollback
#
# Docker Target:
# - Uses the `development` stage from the multi-stage
#   Dockerfile
#
# Why SHA Tags?
# - Exact build reproducibility
# - Easier debugging
# - Safer rollback strategy
# - CI/CD traceability
#
# Registry:
# - GitHub Container Registry (GHCR)
#
# Example Images:
# - ghcr.io/devalltect00/path-header-scanner:dev
# - ghcr.io/devalltect00/path-header-scanner:sha-abc123
# =========================================================

on:
  push:
    branches:
      - develop
      - dev

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker-dev:
    name: 🐳 Build Dev Image
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 📥 CHECKOUT
      # =====================================================

      # 📥 Checkout repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 🐳 DOCKER BUILDX
      # =====================================================

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =====================================================
      # 🔐 LOGIN TO GHCR
      # =====================================================

      # 🔐 Login to GitHub Container Registry
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =====================================================
      # 🏷️ IMAGE METADATA
      # =====================================================

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/path-header-scanner

          tags: |
            type=raw,value=dev
            type=sha

      # 🔤 Normalize repository name → lowercase (required by GHCR)
      - name: 🔤 Normalize image name
        id: vars
        run: |
          echo "image_name=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # =====================================================
      # 🏗️ BUILD AND PUSH
      # =====================================================

      - name: 🏗️ Build & push development image
        uses: docker/build-push-action@v6
        with:
          context: .

          file: Dockerfile

          target: development

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
