# .github/workflows/docker-dev.yml

name: 🐋 Docker Development Image

run-name: 🐋 Dev Docker Build • ${{ github.ref_name }}

# =========================================================
# 🐋 Development Docker Image
# ---------------------------------------------------------
# Trigger:
# - Runs on push to `develop`
# - Can also be triggered manually
#
# Purpose:
# - Build and publish a development Docker image
#
# Published Tags:
# - `:dev`
#     Latest development image
#
# - `:sha-<commit>`
#     Immutable image for debugging and rollback
#
# Docker Target:
# - Uses the `development` stage from the multi-stage
#   Dockerfile
#
# Why SHA Tags?
# - Exact build reproducibility
# - Easier debugging
# - Safer rollback strategy
# - CI/CD traceability
#
# Registry:
# - GitHub Container Registry (GHCR)
#
# Example Images:
# - ghcr.io/<owner>/<repository>:dev
# - ghcr.io/<owner>/<repository>:sha-abc123
# =========================================================

on:
  push:
    branches:
      - develop
      - dev

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker-dev:
    name: 🐳 Build Dev Image
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 📥 CHECKOUT
      # =====================================================

      # 📥 Checkout repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # 🐍 BUILD VERSION
      # =====================================================

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 🔖 Resolve Custy build version
        id: version
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check packaging
          VERSION="$(python -m app.core.build.version)"

          if [[ -z "$VERSION" ]]; then
            echo "Custy build version resolution returned an empty value." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # =====================================================
      # 🐳 DOCKER BUILDX
      # =====================================================

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =====================================================
      # 🔐 LOGIN TO GHCR
      # =====================================================

      # 🔐 Login to GitHub Container Registry
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =====================================================
      # 🏷️ IMAGE METADATA
      # =====================================================

      # 🔤 Normalize repository name → lowercase (required by GHCR)
      - name: 🔤 Normalize image name
        id: vars
        shell: bash
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.vars.outputs.image_name }}

          tags: |
            type=raw,value=dev
            type=sha

      # =====================================================
      # 🏗️ BUILD AND PUSH
      # =====================================================

      - name: 🏗️ Build & push development image
        uses: docker/build-push-action@v6
        with:
          context: .

          file: Dockerfile

          target: development

          build-args: |
            CUSTY_BUILD_VERSION=${{ steps.version.outputs.version }}

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
