# .github/workflows/docker-prod.yml

name: 🐋 Docker Production Image

run-name: 🐋 Production Docker Build • ${{ github.ref_name }}

# =========================================================
# 🐋 Production Docker Image
# ---------------------------------------------------------
# Trigger:
# - Runs on push to `main`
# - Runs on version tags like `v1.2.3`
# - Can also be triggered manually
#
# Purpose:
# - Build and publish stable production Docker images
#
# Published Tags:
# - `:latest`
#     Latest stable production image
#
# - `:v<version>`
#     Versioned production release image
#
# - `:sha-<commit>`
#     Immutable image for debugging and rollback
#
# Docker Target:
# - Uses the `production` stage from the multi-stage
#   Dockerfile
#
# Why Version Tags?
# - Stable release management
# - Easy version pinning
# - Reproducible deployments
#
# Why SHA Tags?
# - Exact build reproducibility
# - Easier debugging
# - Safer rollback strategy
# - CI/CD traceability
#
# Registry:
# - GitHub Container Registry (GHCR)
#
# Example Images:
# - ghcr.io/devalltect00/path-header-scanner:latest
# - ghcr.io/devalltect00/path-header-scanner:v1.2.3
# - ghcr.io/devalltect00/path-header-scanner:sha-abc123
# =========================================================

on:
  push:
    branches:
      - main

    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-prod:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 📥 CHECKOUT
      # =====================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 🐳 SETUP DOCKER BUILDX
      # =====================================================

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =====================================================
      # 🔐 LOGIN TO GHCR
      # =====================================================

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =====================================================
      # 🏷️ DOCKER METADATA
      # =====================================================

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/path-header-scanner

          tags: |

            # latest
            type=raw,value=latest

            # semantic version tags from git tags
            type=ref,event=tag

            # sha tags
            type=sha

      # =====================================================
      # 🏗️ BUILD AND PUSH
      # =====================================================

      - name: 🏗️ Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .

          file: Dockerfile

          target: production

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
