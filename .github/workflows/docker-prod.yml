# .github/workflows/docker-prod.yml

name: 🐋 Docker Production Image

run-name: 🐋 Production Docker Build • ${{ inputs.tag || github.ref_name }}

# =========================================================
# 🐋 Production Docker Image
# ---------------------------------------------------------
# Trigger:
# - Runs when an annotated version tag like `v1.2.3` is pushed
# - Can be triggered manually for an existing annotated version tag
# - Does not run for ordinary commits pushed to `main`
#
# Purpose:
# - Build and publish stable production Docker images
#
# Published Tags:
# - `:latest`
#     Latest stable production image
#
# - `:v<version>`
#     Versioned production release image
#
# Docker Target:
# - Uses the `production` stage from the multi-stage
#   Dockerfile
#
# Why Version Tags?
# - Stable release management
# - Easy version pinning
# - Reproducible deployments
#
# Why Annotated Release Tags?
# - Preserve reviewed release notes in the Git tag message
# - Avoid publishing production images for ordinary commits
# - Keep stable and prerelease image publication predictable
#
# Registry:
# - GitHub Container Registry (GHCR)
#
# Example Images:
# - ghcr.io/<owner>/<repository>:latest
# - ghcr.io/<owner>/<repository>:v1.2.3
# - ghcr.io/<owner>/<repository>:v2.0.0-rc.1
# =========================================================

on:
  push:
    ## branches:
    ##   - main

    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag, such as v2.1.0 or v2.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker-prod:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 📥 CHECKOUT
      # =====================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # =====================================================
      # 🐍 BUILD VERSION
      # =====================================================

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 🔖 Resolve and validate Custy build version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python -m pip install --disable-pip-version-check packaging

          TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+([.-](alpha|beta|rc|dev|post)\.[0-9]+)?(\+[0-9A-Za-z.]+)?$'
          STABLE_TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.]+)?$'
          TAG="$RELEASE_TAG"
          PUBLISH_LATEST=false

          if [[ ! "$TAG" =~ $TAG_REGEX ]]; then
            echo "Invalid Custy release tag: $TAG" >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag does not exist in the repository: $TAG" >&2
            exit 1
          fi

          TAG_TYPE="$(git cat-file -t "refs/tags/$TAG")"
          if [[ "$TAG_TYPE" != "tag" ]]; then
            echo "Production images require an annotated Git tag: $TAG" >&2
            exit 1
          fi

          TAG_MESSAGE="$(git tag -l --format='%(contents)' "$TAG")"
          if [[ -z "${TAG_MESSAGE//[[:space:]]/}" ]]; then
            echo "Annotated release tag has an empty message: $TAG" >&2
            exit 1
          fi

          VERSION="$(python -m app.core.build.version)"
          if [[ -z "$VERSION" ]]; then
            echo "Custy build version resolution returned an empty value." >&2
            exit 1
          fi

          EXPECTED_VERSION="$(python -c 'from packaging.version import Version; import sys; print(Version(sys.argv[1].removeprefix("v")).public)' "$TAG")"
          if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Resolved build version '$VERSION' does not match release tag '$TAG' ('$EXPECTED_VERSION')." >&2
            exit 1
          fi

          if [[ "$TAG" =~ $STABLE_TAG_REGEX ]]; then
            PUBLISH_LATEST=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$PUBLISH_LATEST" >> "$GITHUB_OUTPUT"

      # =====================================================
      # 🐳 SETUP DOCKER BUILDX
      # =====================================================

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =====================================================
      # 🔐 LOGIN TO GHCR
      # =====================================================

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =====================================================
      # 🏷️ DOCKER METADATA
      # =====================================================

      - name: 🔤 Normalize image name
        id: vars
        shell: bash
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.vars.outputs.image_name }}

          tags: |
            # exact stable or prerelease version
            type=raw,value=${{ steps.version.outputs.tag }}

            # latest stable production version
            type=raw,value=latest,enable=${{ steps.version.outputs.publish_latest }}

      # =====================================================
      # 🏗️ BUILD AND PUSH
      # =====================================================

      - name: 🏗️ Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .

          file: Dockerfile

          target: production

          build-args: |
            CUSTY_BUILD_VERSION=${{ steps.version.outputs.version }}

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
