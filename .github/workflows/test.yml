name: Run tests

on:
    push:
        branches:
            - main
            - develop
            - "release/**"
            - "hotfix/**"
    pull_request:
        branches:
            - main
            - develop
            - "release/**"
            - "hotfix/**"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup/python@v5
              with:
                  python-version: "3.11"

            - name: Install Dependencies
              run: |
                  pip install -r requirements.txt
                  pip install ruff pytest

            - name: Run Tests
              run: |
                  pytest

            - name: Check Ruff Format (non-blocking)
              run: ruff format --check app tests || true

            - name: Lint with Ruff (non-blocking)
              run: ruff lint app tests || true
